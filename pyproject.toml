[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlirq-qiskit"
version = "0.1.0"
description = "Import backend-compiled Qiskit circuits into the native MLIRQ compiler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["qiskit>=2.4.2,<2.6"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
mlirq_qiskit = ["py.typed"]
